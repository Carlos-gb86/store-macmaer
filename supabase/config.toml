project_id = "store-macmaer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# This enables the email provider (including login). Global auth.enable_signup
# remains false to reject public registration while allowing provisioned users.
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[storage]
enabled = true
file_size_limit = "10MiB"
